<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SuperSonicType</title>
    <link rel="stylesheet" href="styles.css">
    <script src="https://kit.fontawesome.com/8a4bbedc9a.js" crossorigin="anonymous"></script>
</head>
<body>
    <div class="container">
        <header class="header">
        <h1>SuperSonicType</h1>
    </header>
    <main class="content">
        <p id="paragraph"></p>
        <div class="timer-start-again"><div class="timer-icon"><i class="fa-solid fa-clock"></i><div class="timer">00:00</div></div>
             <button class="start-again">Restart Again</button>
        </div>
        <textarea name="type-space" id="type-space" autocomplete="false"></textarea>
        <div>
            <h1 class="accuracy"></h1>
            <h1 class="wpm"></h1>
            
        </div>
    </main>
    </div>
    <script src="./script3.js" type="module"></script>
</body>
</html>
